[package]
name = "rserial"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Rust serial monitor: terminal UI plus a tsgo7 web UI, fully remote-controllable through a local REST API"
repository = "https://github.com/agrarobotics/rserial"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serialport = "4.6"
color-eyre = "0.6"
arboard = "3"
tiny_http = "0.12"
